# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
# Build command
command = "npm run build"

# Publish directory (output directory after build)
publish = "dist"

# Functions directory (if using Netlify Functions)
# functions = "netlify/functions"

[build.environment]
# Node version. Same major as local development (nvm default 24).
# A bare major resolves to that line's latest release; Astro needs >=22.23.4.
NODE_VERSION = "24"

# Local development configuration
[dev]
# Command to run for local development
command = "npm run dev"

# Port that Astro dev server runs on
targetPort = 4321

# Port for Netlify Dev proxy
port = 8888

# Auto-open browser
autoLaunch = false

# Disable framework detection to prevent interference with Astro's routing
framework = "#custom"

# Production context (main branch)
[context.production]
command = "npm run build"

[context.production.environment]
NODE_ENV = "production"

# Deploy Preview context (pull requests)
[context.deploy-preview]
command = "npm run build"

# Branch deploys
[context.branch-deploy]
command = "npm run build"

# Redirects and rewrites
# Order matters: more specific rules first, catch-all rules last

# Enforce HTTPS
[[redirects]]
from = "http://*alexmbugua.me/*"
to = "https://alexmbugua.me/:splat"
status = 301
force = true

# RSS Feed Shortcuts
[[redirects]]
from = "/rss"
to = "/rss.xml"
status = 301

[[redirects]]
from = "/feed"
to = "/rss.xml"
status = 301

[[redirects]]
from = "/atom.xml"
to = "/rss.xml"
status = 301

# Sitemap Shortcuts
[[redirects]]
from = "/sitemap.xml"
to = "/sitemap-index.xml"
status = 301

[[redirects]]
from = "/sitemap"
to = "/sitemap-index.xml"
status = 301

# Legacy asset paths. Redirect to canonical locations in downloads/
[[redirects]]
from = "/public.pgp"
to = "/downloads/public.pgp"
status = 301

[[redirects]]
from = "/Alex-Mbugua-Ngugi-Resume.pdf"
to = "/downloads/Alex-Mbugua-Ngugi-Resume.pdf"
status = 301

[[redirects]]
from = "/Alex%20Mbugua%20Ngugi%20-%20Resume.pdf"
to = "/downloads/Alex-Mbugua-Ngugi-Resume.pdf"
status = 301

# Notes Vanity URLs
[[redirects]]
from = "/why"
to = "/notes/2026-03-12-guiding-principles"
status = 301

[[redirects]]
from = "/licensing"
to = "/notes/2026-03-12-licensing"
status = 301

# security.txt lives at the RFC 9116 location; the signature covers only that copy.
[[redirects]]
from = "/security.txt"
to = "/.well-known/security.txt"
status = 301

# SPS policy index. The header breadcrumb links /sps, which has no page of its own
[[redirects]]
from = "/sps"
to = "/sps/terms/"
status = 302

# Legacy Blog Patterns
# /blog/YYYY/MM/DD/slug -> /blog/YYYY-MM-DD-slug/
[[redirects]]
from = "/blog/:year/:month/:day/:slug"
to = "/blog/:year-:month-:day-:slug/"
status = 301

# Trailing Slash Normalization for blog posts
[[redirects]]
from = "/blog/:slug"
to = "/blog/:slug/"
status = 301

# Headers
# Content-Type headers for specific files
[[headers]]
for = "/rss.xml"

[headers.values]
Content-Type = "application/rss+xml; charset=UTF-8"

[[headers]]
for = "/sitemap-index.xml"

[headers.values]
Content-Type = "application/xml; charset=UTF-8"

[[headers]]
for = "/sitemap-0.xml"

[headers.values]
Content-Type = "application/xml; charset=UTF-8"

[[headers]]
for = "/robots.txt"

[headers.values]
Content-Type = "text/plain; charset=UTF-8"

# Security headers for all pages
[[headers]]
for = "/*"

[headers.values]
# Content Security Policy - Protects against XSS and other injection attacks
# Note: 'unsafe-inline' is needed for Astro's hydration and astro-themes
# 'data:' is required for Astro's ClientRouter (view transitions)
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://jandee.vercel.app https://jandi.firejune.io https://opengraph.githubassets.com; frame-src 'self' https://jandee.vercel.app https://jandi.firejune.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;"
# Prevents clickjacking attacks (SAMEORIGIN allows embedding from same origin)
X-Frame-Options = "SAMEORIGIN"
# Legacy XSS protection (browsers now use CSP instead)
X-XSS-Protection = "1; mode=block"
# Prevents MIME type sniffing
X-Content-Type-Options = "nosniff"
# Controls referrer information
Referrer-Policy = "strict-origin-when-cross-origin"
# Feature policy to restrict browser features
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
# Strict Transport Security - Forces HTTPS
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
for = "/astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Service worker scripts are unhashed and must be revalidated on every check,
# or a returning visitor keeps an old worker. Hashed build assets live under
# /astro/* (immutable above); no catch-all immutable rule for *.js or *.css.
[[headers]]
for = "/sw.js"

[headers.values]
Cache-Control = "public, max-age=0, no-cache"

[[headers]]
for = "/registerSW.js"

[headers.values]
Cache-Control = "public, max-age=0, no-cache"

# The Workbox runtime is content-hashed (workbox-<hash>.js) and safe to cache forever.
[[headers]]
for = "/workbox-*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff2"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/**/*.png"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/**/*.jpg"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/**/*.webp"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/**/*.svg"

[headers.values]
Cache-Control = "public, max-age=604800"

# API routes must not be cached by CDN or browsers (responses are dynamic)
[[headers]]
for = "/api/*"

[headers.values]
Cache-Control = "no-store"

# Netlify Plugins
# The sitemap comes from @astrojs/sitemap (sitemap-index.xml); a second
# generator would also write sitemap.xml and shadow the redirect below.
# Lighthouse on every deploy (mobile profile), same pages and targets as the
# local `npm run lighthouse` (lighthouserc.cjs). Scores are reported, not
# enforced: set fail_deploy_on_score_thresholds to "true" once they hold.
# SEO is 100 on production only; deploy previews are noindex by design.
[[plugins]]
package = "@netlify/plugin-lighthouse"

[plugins.inputs]
fail_deploy_on_score_thresholds = "false"

[plugins.inputs.thresholds]
performance = 0.9
accessibility = 1
best-practices = 0.95
seo = 1

[[plugins.inputs.audits]]
path = "/"

[[plugins.inputs.audits]]
path = "blog/"

[[plugins.inputs.audits]]
path = "blog/2026-05-19-password-security-with-argon2id/"
